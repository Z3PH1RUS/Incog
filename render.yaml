services:
  - type: web
    name: incog
    runtime: node
    plan: free
    repo: https://github.com/Z3PH1RUS/Incog
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
